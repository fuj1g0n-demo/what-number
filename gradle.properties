# =============================================================================
# プロジェクトのバージョン（単一正本 / Single Source of Truth）
# =============================================================================
# この値はルート・全サブプロジェクト（app / system-test）に適用される。
# リリースプロセス（.github/workflows/cd-release.yml）がこの行を自動で書き換える。
#
# Java / Gradle の流儀:
#   - 開発中（mainline）は末尾に -SNAPSHOT を付与する  例: 0.0.1-SNAPSHOT
#       SNAPSHOT は「未確定・可変」を表し、同一座標で何度でも上書きされる。
#   - リリース時は -SNAPSHOT を外した不変版にする       例: 1.0.0
#       一度発行したリリース版は中身を変えない（イミュータブル）。
#
# 手動でこの値を編集する必要は通常ない。リリースは cd-release.yml から行う。
# -----------------------------------------------------------------------------
group=com.example
version=0.0.1-SNAPSHOT
