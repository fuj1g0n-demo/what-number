name: CI (PR) - Local Tests

# トリガー : main 宛ての Pull Request（作成 / 更新 / 再オープン）
# デプロイ先: なし（CI ランナー内でアプリを起動し、ローカルで検証するのみ）
# 内容     : Build -> Unit Test -> Integration Test -> System Test（ローカル起動）

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-pr-local-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :app:build

      - name: Unit Test
        run: ./gradlew :app:test

      - name: Integration Test
        run: ./gradlew :app:integrationTest

      - name: Install Playwright browsers
        run: ./gradlew :system-test:testClasses && npx playwright install --with-deps chromium

      - name: System Test
        run: |
          ./gradlew :app:bootRun &
          sleep 10
          ./gradlew :system-test:test
          kill %1 || true
