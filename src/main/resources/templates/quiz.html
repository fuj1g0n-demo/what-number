<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'Q' + ${quiz.id()} + ' - この数字、なんの数字？'">クイズ</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark bg-primary mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">この数字、なんの数字？</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <span th:text="'Q' + ${quiz.id()} + ' / ' + ${totalCount}">Q1 / 3</span>
                </div>
                <div class="card-body text-center">
                    <h2 class="display-3 my-4" th:text="${quiz.number()}">3,776</h2>
                    <p class="lead" th:text="${quiz.question()}">この数字、なんの数字？</p>

                    <form th:action="@{/quiz/{id}/answer(id=${quiz.id()})}" method="post">
                        <div class="d-grid gap-2 col-md-8 mx-auto my-4">
                            <button th:each="choice, iter : ${quiz.choices()}"
                                    type="submit"
                                    name="selectedAnswer"
                                    th:value="${iter.index}"
                                    class="btn btn-outline-primary btn-lg"
                                    th:text="${choice}">
                                選択肢
                            </button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="text-center mt-3">
                <a th:href="@{/}" class="btn btn-secondary">一覧に戻る</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
