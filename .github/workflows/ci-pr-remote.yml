name: CI (PR) - Remote Preview Deploy & E2E

# トリガー : main 宛ての Pull Request（作成 / 更新 / 再オープン / クローズ）
# パイプライン構成（job DAG）:
#   build-jar  ──────────────────────────────→ deploy-preview-appservice ─→ e2e-appservice
#   build-image ─→ image-security-scan ─→ deploy-preview-aca        ─→ e2e-aca
#   （PR クローズ時は cleanup-preview が両プレビュー環境を削除）
#
# - build-jar  : bootJar をビルドし GitHub Packages へ publish + デプロイ用に artifact 化
# - build-image: Dockerfile から ACR イメージをビルドして ACR へ push（build=publish）
# - image-security-scan: 公開済みイメージを MDVM でスキャンし Dockerfile 行へ remap（ACA デプロイのゲート）
# - deploy-*   : スキャン済みイメージ / publish 済み jar をプレビュー環境へデプロイ
# - e2e-*      : 各プレビュー URL に対し E2E（System Test）を実行

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ci-pr-remote-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  pull-requests: write
  packages: write          # GitHub Packages への jar publish 用

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACA_ENVIRONMENT: ${{ vars.ACA_ENVIRONMENT }}
  ACR_PULL_IDENTITY_NAME: ${{ vars.ACR_PULL_IDENTITY_NAME }}
  APP_SERVICE_PLAN: ${{ vars.APP_SERVICE_PLAN }}
  APP_SERVICE_WEBAPP_PREFIX: ${{ vars.APP_SERVICE_WEBAPP_PREFIX }}
  IMAGE_REPO: quiz-app
jobs:
  # ===========================================================================
  # build-jar: bootJar をビルド -> GitHub Packages へ publish + デプロイ用に artifact 化
  # ===========================================================================
  build-jar:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      PR_NUM: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        run: |
          ./gradlew :app:bootJar
          JAR=$(find app/build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n1)
          echo "Built jar: $JAR"

      - name: Upload bootJar artifact (deploy-preview-appservice 用)
        uses: actions/upload-artifact@v4
        with:
          name: preview-bootjar-pr-${{ env.PR_NUM }}
          path: app/build/libs/*.jar
          if-no-files-found: error

      - name: Publish jar to GitHub Packages (Maven)
        env:
          GITHUB_PACKAGES_URL: https://maven.pkg.github.com/${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          BASE_VERSION=$(grep -E '^version=' gradle.properties | head -n1 | cut -d= -f2 | sed 's/-SNAPSHOT$//')
          ARTIFACT_VERSION="${BASE_VERSION}-pr${PR_NUM}-${SHORT_SHA}"
          echo "Publishing com.example:what-number:${ARTIFACT_VERSION} to GitHub Packages (${GITHUB_PACKAGES_URL})"
          ./gradlew :app:publishBootAppPublicationToGithubPackagesRepository -PartifactVersion="${ARTIFACT_VERSION}" --no-daemon
          {
            echo "## Java 成果物の発行 (GitHub Packages)"
            echo ""
            echo "- レジストリ: \`${GITHUB_PACKAGES_URL}\`"
            echo "- 座標: \`com.example:what-number:${ARTIFACT_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # ===========================================================================
  # build-image: Dockerfile から ACR イメージをビルドし ACR へ push（build=publish）
  # ===========================================================================
  build-image:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      PR_NUM: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push preview image (ACR Build)
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az acr build \
            --registry "$ACR_NAME" \
            --image "${IMAGE_REPO}:pr-${PR_NUM}-${{ github.sha }}" \
            --file Dockerfile \
            .

  # ===========================================================================
  # image-security-scan: 公開済みイメージを MDVM でスキャン -> Dockerfile 行へ remap -> SARIF 投入
  #   （ACA デプロイのゲート。high/critical は code scanning の check 失敗として可視化）
  # ===========================================================================
  image-security-scan:
    if: github.event.action != 'closed'
    needs: build-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write         # Azure Login / ACR pull (OIDC) 用
      actions: read           # private リポジトリで upload-sarif が run 情報取得に必要
      security-events: write  # code scanning への SARIF 投入に必須（GHAS 前提）
      pull-requests: write    # code scanning 結果へのリンクを PR コメントに投稿する用
    env:
      PR_NUM: ${{ github.event.pull_request.number }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download Defender for Cloud CLI
        run: |
          curl -L -o defender "https://aka.ms/defender-cli_linux-x64"
          chmod +x defender

      - name: Run Defender for Cloud CLI image scan (MDVM) + SBOM
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:pr-${PR_NUM}-${{ github.sha }}"
          echo "Scanning image with Defender for Cloud CLI (MDVM): $IMAGE"
          ./defender scan image "$IMAGE" --defender-output defender-mdvm.sarif
          # OS/言語の判別（purl）用に CycloneDX SBOM も生成する
          ./defender scan sbom "$IMAGE" --sbom-format cyclonedx1.6-json --output sbom.json

      # MDVM はコンテナの脆弱性をイメージ参照に紐付けて報告するため、SARIF の location を
      # Dockerfile の該当行へ anchor し、CodeQL と同様に PR インライン注釈／差分行ゲートを効かせる。
      - name: Anchor MDVM SARIF locations to Dockerfile
        id: anchor
        uses: fuj1g0n/sarif-dockerfile-anchor@v0.3.0
        with:
          sarif: defender-mdvm.sarif
          sbom: sbom.json
          dockerfile: Dockerfile
          output: defender-mdvm.enriched.sarif

      - name: Upload Defender CLI results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.anchor.outputs.sarif }}
          category: defender-mdvm

      # GitHub は新しい code scanning 構成を初めて導入したときだけ、
      # github-advanced-security のオンボーディングコメント（PR の code scanning 結果へのリンク付き）を投稿する。
      # 既にオンボーディング済みの構成では再表示されないため、同じ結果一覧へのリンクを
      # 自前で sticky コメントとして投稿する。
      - name: Comment a link to this PR's code scanning results
        if: ${{ github.event.pull_request.number }}
        uses: actions/github-script@v7
        env:
          SARIF: ${{ steps.anchor.outputs.sarif }}
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const url = `https://github.com/${owner}/${repo}/security/code-scanning?query=pr%3A${pr}+is%3Aopen`;
            const sev = { critical: 0, high: 0, medium: 0, low: 0 };
            let total = 0;
            try {
              const sarif = JSON.parse(fs.readFileSync(process.env.SARIF, 'utf8'));
              for (const run of sarif.runs || []) {
                const score = {};
                for (const rule of run.tool?.driver?.rules || []) {
                  const s = rule.properties?.['security-severity'];
                  if (s !== undefined) score[rule.id] = Number(s);
                }
                for (const res of run.results || []) {
                  total++;
                  const s = score[res.ruleId];
                  if (s >= 9.0) sev.critical++;
                  else if (s >= 7.0) sev.high++;
                  else if (s >= 4.0) sev.medium++;
                  else if (s > 0.0) sev.low++;
                  else if (res.level === 'error') sev.high++;
                  else if (res.level === 'note') sev.low++;
                  else sev.medium++;
                }
              }
            } catch (e) {
              core.warning(`Could not read SARIF for finding counts: ${e.message}`);
            }
            const marker = '<!-- defender-mdvm-scan-results -->';
            const body = [
              marker,
              '## Defender (MDVM) code scanning results',
              '',
              `**${total}** finding(s) were uploaded to GitHub code scanning for this pull request.`,
              '',
              `Severity breakdown \u2014 Critical: ${sev.critical}, High: ${sev.high}, Medium: ${sev.medium}, Low: ${sev.low}.`,
              '',
              `- **[View all code scanning alerts for this pull request](${url})**`,
              '',
              'Individual alerts are also annotated inline on the **Files changed** tab.',
            ].join('\n');
            const { data: comments } = await github.rest.issues.listComments({
              owner, repo, issue_number: pr, per_page: 100,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body && c.body.includes(marker),
            );
            if (existing) {
              await github.rest.issues.updateComment({
                owner, repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner, repo, issue_number: pr, body,
              });
            }

  # ===========================================================================
  # deploy-preview-aca: スキャン済みイメージを Azure Container Apps へデプロイ
  # ===========================================================================
  deploy-preview-aca:
    if: github.event.action != 'closed'
    needs: image-security-scan
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      APP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}-pr-${{ github.event.pull_request.number }}
      PR_NUM: ${{ github.event.pull_request.number }}
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy preview container app
        id: deploy
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:pr-${PR_NUM}-${{ github.sha }}"
          UAMI_ID=$(az identity show -g "$RESOURCE_GROUP" -n "$ACR_PULL_IDENTITY_NAME" --query id -o tsv)
          # 最後の push から 1 時間後を TTL とする（TTL Cleanup ワークフローが削除）
          TTL_EXPIRE=$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)

          if az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Updating existing preview app: $APP_NAME"
            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --output none
          else
            echo "Creating preview app: $APP_NAME"
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENVIRONMENT" \
              --image "$IMAGE" \
              --target-port 8080 \
              --ingress external \
              --registry-server "${ACR_NAME}.azurecr.io" \
              --registry-identity "$UAMI_ID" \
              --user-assigned "$UAMI_ID" \
              --min-replicas 1 \
              --max-replicas 1 \
              --cpu 0.5 --memory 1.0Gi \
              --output none
          fi

          # TTL タグを毎回更新（push のたびにリセット）
          APP_ID=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" --query id -o tsv)
          az tag update \
            --resource-id "$APP_ID" \
            --operation Merge \
            --tags Environment=preview PullRequest="$PR_NUM" TTLExpire="$TTL_EXPIRE" \
            --output none

          FQDN=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"

      - name: Wait for preview to be ready
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Waiting for $URL to return HTTP 200..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "Preview is ready (HTTP $CODE)."
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE, retrying in 10s..."
            sleep 10
          done
          echo "Preview did not become ready in time."
          exit 1

  # ===========================================================================
  # deploy-preview-appservice: publish 済み bootJar を Azure App Service へデプロイ
  # ===========================================================================
  deploy-preview-appservice:
    if: github.event.action != 'closed'
    needs: build-jar
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    env:
      WEBAPP_NAME: ${{ vars.APP_SERVICE_WEBAPP_PREFIX }}-pr-${{ github.event.pull_request.number }}
      PR_NUM: ${{ github.event.pull_request.number }}
    steps:
      - name: Download bootJar artifact
        uses: actions/download-artifact@v4
        with:
          name: preview-bootjar-pr-${{ env.PR_NUM }}
          path: app/build/libs

      - name: Resolve jar path
        run: |
          JAR=$(find app/build/libs -maxdepth 1 -name '*.jar' ! -name '*-plain.jar' | head -n1)
          echo "JAR_PATH=$JAR" >> "$GITHUB_ENV"
          echo "Jar to deploy: $JAR"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Create or reuse preview web app and deploy jar
        id: deploy
        run: |
          # 最後の push から 1 時間後を TTL とする（TTL Cleanup ワークフローが削除）
          TTL_EXPIRE=$(date -u -d '+1 hour' +%Y-%m-%dT%H:%M:%SZ)

          if az webapp show -n "$WEBAPP_NAME" -g "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Reusing existing preview web app: $WEBAPP_NAME"
          else
            echo "Creating preview web app: $WEBAPP_NAME"
            # GitHub ホストランナーの az CLI はランタイムカタログが古く
            # （JAVA|11-java11 までしか持たない）、create 時に Java 21 を直接指定すると
            # 「not supported」で弾かれる。そこでまず Java 21 を試し、失敗した場合は
            # カタログに存在する Java 11 で作成してから linux-fx-version で Java 21 を
            # 強制する（linux-fx-version は生のパススルーでカタログ検証されず、
            # App Service プラットフォーム側は Java 21 を提供するため動作する）。
            if ! az webapp create \
                  --name "$WEBAPP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --plan "$APP_SERVICE_PLAN" \
                  --runtime "JAVA:21-java21" \
                  --output none 2>/dev/null; then
              echo "Java 21 の直接指定に失敗。Java 11 で作成し linux-fx-version で上書きします。"
              az webapp create \
                --name "$WEBAPP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --plan "$APP_SERVICE_PLAN" \
                --runtime "JAVA:11-java11" \
                --output none \
              || az webapp create \
                --name "$WEBAPP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --plan "$APP_SERVICE_PLAN" \
                --runtime "JAVA|11-java11" \
                --output none
            fi
            # 実行ランタイムを Java 21 に強制する
            az webapp config set \
              --name "$WEBAPP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --linux-fx-version "JAVA|21-java21" \
              --output none
          fi

          # TTL タグを毎回更新（push のたびにリセット）
          APP_ID=$(az webapp show -n "$WEBAPP_NAME" -g "$RESOURCE_GROUP" --query id -o tsv)
          az tag update \
            --resource-id "$APP_ID" \
            --operation Merge \
            --tags Environment=preview PullRequest="$PR_NUM" TTLExpire="$TTL_EXPIRE" \
            --output none

          # bootJar をデプロイ（App Service が app.jar にリネームして実行）
          az webapp deploy \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --type jar \
            --src-path "$JAR_PATH" \
            --output none

          FQDN=$(az webapp show -n "$WEBAPP_NAME" -g "$RESOURCE_GROUP" \
            --query defaultHostName -o tsv)
          echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"

      - name: Wait for preview to be ready
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Waiting for $URL to return HTTP 200..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "Preview is ready (HTTP $CODE)."
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE, retrying in 10s..."
            sleep 10
          done
          echo "Preview did not become ready in time."
          exit 1

  # ===========================================================================
  # e2e-aca: ACA プレビュー URL に対し E2E（System Test）を実行
  # ===========================================================================
  e2e-aca:
    if: github.event.action != 'closed'
    needs: deploy-preview-aca
    runs-on: ubuntu-latest
    env:
      PR_NUM: ${{ github.event.pull_request.number }}
      PREVIEW_URL: ${{ needs.deploy-preview-aca.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Playwright browsers
        run: ./gradlew :system-test:testClasses && npx playwright install --with-deps chromium

      - name: Run E2E (System Test) against preview
        id: e2e
        continue-on-error: true
        run: ./gradlew :system-test:test -Dtest.base-url="$PREVIEW_URL"

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-aca-pr-${{ env.PR_NUM }}
          path: system-test/build/screenshots/
          if-no-files-found: ignore

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-aca-pr-${{ env.PR_NUM }}
          path: system-test/build/reports/tests/test/
          if-no-files-found: ignore

      - name: Comment PR with preview URL and E2E result
        if: always()
        uses: actions/github-script@v7
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const url = process.env.PREVIEW_URL;
            const e2e = process.env.E2E_OUTCOME;
            const e2eLine = e2e === 'success'
              ? '**E2E (System Test):** ✅ Passed'
              : '**E2E (System Test):** ❌ Failed — Actions のログとアーティファクトを確認してください';
            const marker = 'Preview Environment (Azure Container Apps)';
            const body = [
              `## 🔍 ${marker}`,
              '',
              `**URL:** ${url}`,
              '',
              e2eLine,
              '',
              '> このプレビュー環境は最後の push から 1 時間後、または PR クローズ時に自動削除されます。',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body,
              });
            }

      - name: Show preview summary
        if: always()
        run: |
          {
            echo "## Preview Deployed (Azure Container Apps)"
            echo ""
            echo "**URL:** ${PREVIEW_URL}"
            echo ""
            echo "**E2E result:** ${{ steps.e2e.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if E2E failed
        if: steps.e2e.outcome == 'failure'
        run: |
          echo "E2E tests failed against the Azure Container Apps preview environment."
          exit 1

  # ===========================================================================
  # e2e-appservice: App Service プレビュー URL に対し E2E（System Test）を実行
  # ===========================================================================
  e2e-appservice:
    if: github.event.action != 'closed'
    needs: deploy-preview-appservice
    runs-on: ubuntu-latest
    env:
      PR_NUM: ${{ github.event.pull_request.number }}
      PREVIEW_URL: ${{ needs.deploy-preview-appservice.outputs.url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Playwright browsers
        run: ./gradlew :system-test:testClasses && npx playwright install --with-deps chromium

      - name: Run E2E (System Test) against preview
        id: e2e
        continue-on-error: true
        run: ./gradlew :system-test:test -Dtest.base-url="$PREVIEW_URL"

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-appservice-pr-${{ env.PR_NUM }}
          path: system-test/build/screenshots/
          if-no-files-found: ignore

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report-appservice-pr-${{ env.PR_NUM }}
          path: system-test/build/reports/tests/test/
          if-no-files-found: ignore

      - name: Comment PR with preview URL and E2E result
        if: always()
        uses: actions/github-script@v7
        env:
          E2E_OUTCOME: ${{ steps.e2e.outcome }}
        with:
          script: |
            const prNum = context.payload.pull_request.number;
            const url = process.env.PREVIEW_URL;
            const e2e = process.env.E2E_OUTCOME;
            const e2eLine = e2e === 'success'
              ? '**E2E (System Test):** ✅ Passed'
              : '**E2E (System Test):** ❌ Failed — Actions のログとアーティファクトを確認してください';
            const marker = 'Preview Environment (Azure App Service)';
            const body = [
              `## 🔍 ${marker}`,
              '',
              `**URL:** ${url}`,
              '',
              e2eLine,
              '',
              '> このプレビュー環境は最後の push から 1 時間後、または PR クローズ時に自動削除されます。',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNum,
            });
            const existing = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNum,
                body,
              });
            }

      - name: Show preview summary
        if: always()
        run: |
          {
            echo "## Preview Deployed (Azure App Service)"
            echo ""
            echo "**URL:** ${PREVIEW_URL}"
            echo ""
            echo "**E2E result:** ${{ steps.e2e.outcome }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail job if E2E failed
        if: steps.e2e.outcome == 'failure'
        run: |
          echo "E2E tests failed against the Azure App Service preview environment."
          exit 1

  # ===========================================================================
  # cleanup-preview: PR クローズ時に両プレビュー環境を削除
  # ===========================================================================
  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest

    env:
      APP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}-pr-${{ github.event.pull_request.number }}
      WEBAPP_NAME: ${{ vars.APP_SERVICE_WEBAPP_PREFIX }}-pr-${{ github.event.pull_request.number }}
      PR_NUM: ${{ github.event.pull_request.number }}

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Delete preview container app (Azure Container Apps)
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          echo "Deleting preview container app: $APP_NAME"
          az containerapp delete \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --yes || true

          {
            echo "## Preview Environment Cleaned Up (Azure Container Apps)"
            echo ""
            echo "Deleted container app **${APP_NAME}** for PR #${PR_NUM}."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Delete preview web app (Azure App Service)
        run: |
          echo "Deleting preview web app: $WEBAPP_NAME"
          az webapp delete \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" || true

          {
            echo "## Preview Environment Cleaned Up (Azure App Service)"
            echo ""
            echo "Deleted web app **${WEBAPP_NAME}** for PR #${PR_NUM}."
          } >> "$GITHUB_STEP_SUMMARY"
