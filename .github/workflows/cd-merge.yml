name: CD (Merge) - Production Deploy

# トリガー : main への push（= PR マージ）／手動実行（workflow_dispatch）
# デプロイ先: 本番用 Azure Container App（本番環境）
# 内容     : イメージ build -> 本番 ACA へ deploy（継続デプロイ / Continuous Deployment）

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACA_ENVIRONMENT: ${{ vars.ACA_ENVIRONMENT }}
  ACR_PULL_IDENTITY_NAME: ${{ vars.ACR_PULL_IDENTITY_NAME }}
  APP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}
  IMAGE_REPO: quiz-app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (ACR Build)
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az acr build \
            --registry "$ACR_NAME" \
            --image "${IMAGE_REPO}:${{ github.sha }}" \
            --image "${IMAGE_REPO}:latest" \
            --file Dockerfile \
            .

      - name: Deploy container app
        id: deploy
        run: |
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${{ github.sha }}"
          UAMI_ID=$(az identity show -g "$RESOURCE_GROUP" -n "$ACR_PULL_IDENTITY_NAME" --query id -o tsv)

          if az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Updating existing container app: $APP_NAME"
            az containerapp update \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --output none
          else
            echo "Creating container app: $APP_NAME"
            az containerapp create \
              --name "$APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENVIRONMENT" \
              --image "$IMAGE" \
              --target-port 8080 \
              --ingress external \
              --registry-server "${ACR_NAME}.azurecr.io" \
              --registry-identity "$UAMI_ID" \
              --user-assigned "$UAMI_ID" \
              --min-replicas 1 \
              --max-replicas 2 \
              --cpu 0.5 --memory 1.0Gi \
              --tags Project=quiz-app Environment=production \
              --output none
          fi

          FQDN=$(az containerapp show -n "$APP_NAME" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"

      - name: Show deployed URL
        run: |
          {
            echo "## Deployment Complete"
            echo ""
            echo "**URL:** ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
