name: CI (PR) - Local Tests

# トリガー : main 宛ての Pull Request（作成 / 再オープン / 更新）
# デプロイ先: なし（CI ランナー内でアプリを起動し、ローカルで検証するのみ）
# 構成 (job DAG):
#   build ─→ unit-test
#         ─→ integration-test
#         ─→ system-test（CI ランナー内でアプリを起動）

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-pr-local-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ===========================================================================
  # build: アプリをコンパイル/アセンブルし、ビルドの健全性を先に確認する
  # ===========================================================================
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Build (assemble, テストは実行しない)
        run: ./gradlew :app:assemble

  # ===========================================================================
  # unit-test: 個々のクラス・メソッド単位の単体テスト
  # ===========================================================================
  unit-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Unit Test
        run: ./gradlew :app:test

  # ===========================================================================
  # integration-test: 複数コンポーネント間の結合テスト
  # ===========================================================================
  integration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Integration Test
        run: ./gradlew :app:integrationTest

  # ===========================================================================
  # system-test: CI ランナー内でアプリを起動し、E2E（System Test）を実行
  # ===========================================================================
  system-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Install Playwright browsers
        run: ./gradlew :system-test:testClasses && npx playwright install --with-deps chromium

      - name: System Test
        run: |
          ./gradlew :app:bootRun &
          sleep 10
          ./gradlew :system-test:test
          kill %1 || true
