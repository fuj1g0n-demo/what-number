name: Dependency Review

# 注意 (Gradle 固有) :
#   GitHub は Maven と異なり build.gradle(.kts) を自動解析できないため、
#   PR の head コミットに対しても依存関係グラフを明示的に送信しないと
#   dependency-review-action は差分を検出できない
#   （"No snapshots were found for the head SHA ..." となり何も検出されない）。
#   そのため、レビュー実行前に gradle/actions/dependency-submission で
#   head コミットの依存グラフを生成・送信する。
#   base 側のグラフは dependency-submission.yml が main で登録している。

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

permissions:
  contents: write        # 依存グラフ送信 (dependency submission) に必要
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@v6.4.1

      - name: Dependency Review
        uses: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # 送信直後はスナップショットの反映に遅延が出ることがあるためリトライする
          retry-on-snapshot-warnings: true
          retry-on-snapshot-warnings-timeout: 120
