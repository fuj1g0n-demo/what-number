<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>この数字、なんの数字？</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark navbar-gradient mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">この数字、なんの数字？</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h1 class="mb-4">クイズ一覧</h1>
            <div class="list-group">
                <a th:each="quiz : ${quizzes}"
                   th:href="@{/quiz/{id}(id=${quiz.id()})}"
                   class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    <span>
                        <strong th:text="'Q' + ${quiz.id()}">Q1</strong>
                        <span class="ms-2" th:text="'数字: ' + ${quiz.number()}">数字: ???</span>
                    </span>
                    <span class="badge bg-primary rounded-pill">挑戦する</span>
                </a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
