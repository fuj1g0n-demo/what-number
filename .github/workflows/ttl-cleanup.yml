name: TTL Cleanup Preview Environments

# TTLExpire タグが期限切れになったプレビュー用 Container App を定期削除する。

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  group: ttl-cleanup
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  cleanup-expired:
    runs-on: ubuntu-latest
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Find and delete expired preview apps
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          DELETED=0
          KEPT=0

          echo "Current time (UTC): $NOW"

          # Environment=preview タグが付いた Container App のみ対象
          APPS=$(az containerapp list \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?tags.Environment=='preview'].name" \
            -o tsv 2>/dev/null || true)

          if [ -z "$APPS" ]; then
            echo "No preview container apps found."
            exit 0
          fi

          for APP in $APPS; do
            TTL_EXPIRE=$(az containerapp show \
              --name "$APP" \
              --resource-group "$RESOURCE_GROUP" \
              --query "tags.TTLExpire" \
              -o tsv 2>/dev/null || true)

            if [ -z "$TTL_EXPIRE" ] || [ "$TTL_EXPIRE" = "None" ]; then
              echo "Skipping $APP (no TTLExpire tag)"
              continue
            fi

            if [[ "$NOW" > "$TTL_EXPIRE" ]]; then
              echo "Deleting expired app: $APP (expired: $TTL_EXPIRE)"
              az containerapp delete \
                --name "$APP" \
                --resource-group "$RESOURCE_GROUP" \
                --yes || true
              DELETED=$((DELETED + 1))
            else
              echo "Keeping app: $APP (expires: $TTL_EXPIRE)"
              KEPT=$((KEPT + 1))
            fi
          done

          {
            echo "## TTL Cleanup Summary"
            echo ""
            echo "- **Deleted:** ${DELETED} expired app(s)"
            echo "- **Kept:** ${KEPT} active app(s)"
          } >> "$GITHUB_STEP_SUMMARY"
