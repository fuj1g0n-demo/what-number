name: "Security - Microsoft Security DevOps"

# Microsoft Security DevOps (MSDO) を実行し、結果を SARIF として
# GitHub の Code scanning alerts（Security タブ）へ投入するワークフロー。
#
# 目的     : Microsoft Defender for Cloud 系のセキュリティスキャン
#            （Checkov / Trivy / Template Analyzer など）の結果を GHAS の
#            code scanning へ取り込み、既存の CodeQL（Java / Actions）を
#            IaC・コンテナ観点で補完する。
# 投入経路 : MSDO Action -> SARIF -> github/codeql-action/upload-sarif -> Security タブ
# 前提     : private リポジトリのため GHAS / GitHub Code Security の有効化が必要
#            （本リポジトリは CodeQL が稼働済みのため有効）。
# 参考     : https://learn.microsoft.com/azure/defender-for-cloud/github-action

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '18 3 * * 5'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  msdo:
    name: Microsoft Security DevOps
    # Linux ランナーで実行（Windows 専用の AntiMalware はスキップされる）
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Defender for Cloud との OIDC フェデレーション用（GitHub コネクタ連携時に使用）
      id-token: write
      # private リポジトリのワークフローで必要
      actions: read
      # MSDO の結果を Security タブ（code scanning）へ投入するために必須（GHAS 前提）
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # MSDO（静的解析ツール群: Checkov / Trivy / Template Analyzer 等）を実行
      # ※本番運用ではリリースタグ/SHA へのピン留めを推奨
      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@latest
        id: msdo
        with:
          # 既定ポリシーで実際に動作していた checkov / templateanalyzer に
          # trivy（コンテナ/依存/ファイルシステムの脆弱性スキャン）を追加する。
          # tools を明示指定すると指定セットのみ実行される。bandit / binskim /
          # eslint は本リポジトリに対象（Python / バイナリ / JS,TS）が無く、
          # 明示指定するとターゲット無しでエラー終了し build break するため含めない。
          tools: checkov,templateanalyzer,trivy

      # 出力 SARIF を GitHub の code scanning（Security タブ）へアップロード
      # category を付与して CodeQL の結果と区別する
      - name: Upload results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
          category: msdo
