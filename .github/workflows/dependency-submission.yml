name: Dependency Submission

# トリガー : main への push（= PR マージ）／手動実行（workflow_dispatch）
# 目的     : Gradle の依存関係グラフを GitHub の Dependency Graph へ送信する。
#            Gradle は Maven と異なり GitHub がマニフェストから自動解析できないため、
#            このワークフローで明示的にグラフを登録する。これにより
#            Dependabot アラート / Dependency Review が依存関係を解決できるようになる。

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@v4
