name: CI (PR) - Local Tests

# デプロイ先: なし（CI ランナー内でアプリを起動し、ローカルで検証するのみ）

on:
  pull_request:
    branches: [ main ]
    types: [opened, synchronize, reopened]

concurrency:
  group: ci-pr-local-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.2

      - name: Build (assemble, テストは実行しない)
        run: ./gradlew :app:assemble

  unit-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.2

      - name: Unit Test
        run: ./gradlew :app:test

  integration-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.2

      - name: Integration Test
        run: ./gradlew :app:integrationTest

  system-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5.1.0

      - name: Set up JDK 21
        uses: actions/setup-java@v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5.0.2

      - name: Install Playwright browsers
        run: ./gradlew :system-test:testClasses && npx playwright install --with-deps chromium

      - name: System Test
        run: |
          ./gradlew :app:bootRun &
          sleep 10
          ./gradlew :system-test:test
          kill %1 || true
