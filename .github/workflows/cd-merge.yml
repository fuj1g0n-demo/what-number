name: CD (Merge) - Staging Deploy

# トリガー : main への push（= PR マージ）／手動実行（workflow_dispatch）
# デプロイ先: ステージング環境（リリース時に本番 prod へ展開する想定）
#   - Azure Container Apps (staging)
#   - Azure App Service   (staging)
# 成果物   : 本プロジェクトの Java 成果物 (bootJar) を Azure DevOps の
#            Azure Artifacts (Maven フィード) へ発行する
# 構成     : build-and-publish -> (deploy-aca / deploy-appservice を並列実行)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cd-merge-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write
  contents: read
  packages: write

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACA_ENVIRONMENT: ${{ vars.ACA_ENVIRONMENT }}
  ACR_PULL_IDENTITY_NAME: ${{ vars.ACR_PULL_IDENTITY_NAME }}
  APP_SERVICE_PLAN: ${{ vars.APP_SERVICE_PLAN }}
  APP_SERVICE_LOCATION: ${{ vars.APP_SERVICE_LOCATION || vars.AZURE_LOCATION }}
  APP_SERVICE_PLAN_SKU: ${{ vars.APP_SERVICE_PLAN_SKU || 'B1' }}
  IMAGE_REPO: quiz-app
  # Azure DevOps Artifacts
  AZURE_DEVOPS_ORG: ${{ vars.AZURE_DEVOPS_ORG }}
  AZURE_DEVOPS_PROJECT: ${{ vars.AZURE_DEVOPS_PROJECT }}
  AZURE_ARTIFACTS_FEED: ${{ vars.AZURE_ARTIFACTS_FEED }}

jobs:
  # ---------------------------------------------------------------------------
  # ビルド & 成果物発行: bootJar をビルドし、ACR へイメージを push、
  #                      Java 成果物を Azure Artifacts (Maven) へ発行する
  # ---------------------------------------------------------------------------
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build bootJar
        run: |
          ./gradlew :app:bootJar
          JAR=$(ls app/build/libs/*.jar | grep -v 'plain')
          echo "JAR_PATH=$JAR" >> "$GITHUB_ENV"
          echo "Built jar: $JAR"

      - name: Upload bootJar artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bootjar
          path: app/build/libs/*.jar
          if-no-files-found: error

      - name: Ensure Azure Artifacts feed exists (best-effort)
        env:
          AZURE_DEVOPS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          # フィードが無ければ作成する。既存(409)や権限不足(403)でも publish は
          # 既存フィードに対して動作するため、ここでは失敗で停止させない。
          # プロジェクトスコープのフィードのため URL に project セグメントを含める。
          code=$(curl -s -o /tmp/feed.json -w '%{http_code}' \
            -u ":${AZURE_DEVOPS_PAT}" \
            -H "Content-Type: application/json" \
            -X POST "https://feeds.dev.azure.com/${AZURE_DEVOPS_ORG}/${AZURE_DEVOPS_PROJECT}/_apis/packaging/feeds?api-version=7.1-preview.1" \
            -d "{\"name\":\"${AZURE_ARTIFACTS_FEED}\"}" || echo "000")
          echo "feed ensure HTTP ${code}"
          case "$code" in
            201) echo "フィード '${AZURE_ARTIFACTS_FEED}' を新規作成しました。" ;;
            409) echo "フィード '${AZURE_ARTIFACTS_FEED}' は既存です。" ;;
            *)   echo "フィード作成はスキップ（既存または作成権限不足）。既存フィードへ publish します。" ;;
          esac

      - name: Publish jar to Azure Artifacts (Maven)
        env:
          AZURE_ARTIFACTS_FEED_URL: https://pkgs.dev.azure.com/${{ vars.AZURE_DEVOPS_ORG }}/${{ vars.AZURE_DEVOPS_PROJECT }}/_packaging/${{ vars.AZURE_ARTIFACTS_FEED }}/maven/v1
          AZURE_ARTIFACTS_USER: AzureDevOps
          AZURE_ARTIFACTS_PAT: ${{ secrets.AZURE_DEVOPS_PAT }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # バージョンは gradle.properties を単一正本とする。-SNAPSHOT を外した
          # 基底バージョンに short-sha を付与してステージング成果物を一意化する。
          BASE_VERSION=$(grep -E '^version=' gradle.properties | head -n1 | cut -d= -f2 | sed 's/-SNAPSHOT$//')
          ARTIFACT_VERSION="${BASE_VERSION}-${SHORT_SHA}"
          echo "Publishing com.example:what-number:${ARTIFACT_VERSION} to Azure Artifacts feed '${AZURE_ARTIFACTS_FEED}'"
          ./gradlew :app:publishBootAppPublicationToAzureArtifactsRepository -PartifactVersion="${ARTIFACT_VERSION}" --no-daemon
          {
            echo "## Java 成果物の発行 (Azure Artifacts)"
            echo ""
            echo "- フィード: \`${AZURE_ARTIFACTS_FEED}\` (org: ${AZURE_DEVOPS_ORG} / project: ${AZURE_DEVOPS_PROJECT})"
            echo "- 座標: \`com.example:what-number:${ARTIFACT_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish jar to GitHub Packages (Maven)
        env:
          GITHUB_PACKAGES_URL: https://maven.pkg.github.com/${{ github.repository }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          # バージョンは gradle.properties を単一正本とする（上と同じ算出）。
          BASE_VERSION=$(grep -E '^version=' gradle.properties | head -n1 | cut -d= -f2 | sed 's/-SNAPSHOT$//')
          ARTIFACT_VERSION="${BASE_VERSION}-${SHORT_SHA}"
          echo "Publishing com.example:what-number:${ARTIFACT_VERSION} to GitHub Packages (${GITHUB_PACKAGES_URL})"
          ./gradlew :app:publishBootAppPublicationToGithubPackagesRepository -PartifactVersion="${ARTIFACT_VERSION}" --no-daemon
          {
            echo "## Java 成果物の発行 (GitHub Packages)"
            echo ""
            echo "- レジストリ: \`${GITHUB_PACKAGES_URL}\`"
            echo "- 座標: \`com.example:what-number:${ARTIFACT_VERSION}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push image (ACR Build)
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          az acr build \
            --registry "$ACR_NAME" \
            --image "${IMAGE_REPO}:${{ github.sha }}" \
            --image "${IMAGE_REPO}:staging" \
            --file Dockerfile \
            .

  # ---------------------------------------------------------------------------
  # image-security-scan: ACR へ publish 済みのイメージ／ソースに対して
  #   2 系統のセキュリティスキャンを実行し、結果を GitHub code scanning へ投入する。
  #     系統1: Microsoft Security DevOps (Trivy / Checkov / Template Analyzer)
  #            → リポジトリ／IaC／Dockerfile を SARIF 化して投入
  #     系統2: Defender for Cloud CLI (MDVM) による ACR イメージスキャン
  #            → コンテナイメージを SARIF 化して投入（結果は Defender for Cloud にも集約）
  #   deploy ジョブとは独立（needs: build-and-publish のみ）。スキャン失敗が
  #   デプロイをブロックしないよう別ジョブに分離している。
  # ---------------------------------------------------------------------------
  image-security-scan:
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write         # Azure Login / ACR pull (OIDC) 用
      security-events: write  # code scanning への SARIF 投入に必須（GHAS 前提）
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # --- 系統1: MSDO (Trivy 他) -> SARIF -> code scanning ---
      - name: Run Microsoft Security DevOps (Trivy / Checkov / Template Analyzer)
        uses: microsoft/security-devops-action@latest
        id: msdo
        with:
          # 本リポジトリに対象のあるツールのみ明示指定（空ツールの build break を回避）
          tools: checkov,templateanalyzer,trivy

      - name: Upload MSDO results to Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
          category: msdo

      # --- 系統2: Defender for Cloud CLI (MDVM) で ACR イメージをスキャン -> SARIF ---
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Download Defender for Cloud CLI
        run: |
          curl -L -o defender "https://aka.ms/defender-cli_linux-x64"
          chmod +x defender

      - name: Run Defender for Cloud CLI image scan (MDVM) -> SARIF
        # 認証情報（Defender CSPM 用トークン）未設定でもパイプラインを止めないため継続
        continue-on-error: true
        env:
          DEFENDER_TENANT_ID: ${{ secrets.DEFENDER_TENANT_ID }}
          DEFENDER_CLIENT_ID: ${{ secrets.DEFENDER_CLIENT_ID }}
          DEFENDER_CLIENT_SECRET: ${{ secrets.DEFENDER_CLIENT_SECRET }}
        run: |
          az acr login --name "$ACR_NAME"
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${{ github.sha }}"
          echo "Scanning image with Defender for Cloud CLI (MDVM): $IMAGE"
          ./defender scan image "$IMAGE" --defender-output defender-mdvm.sarif || true

      - name: Upload Defender CLI results to Security tab
        # SARIF が生成できた場合のみ投入（認証未設定時はスキップ）
        if: ${{ hashFiles('defender-mdvm.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: defender-mdvm.sarif
          category: defender-mdvm

  # ---------------------------------------------------------------------------
  # deploy-aca: ステージング用 Azure Container App へデプロイ
  # ---------------------------------------------------------------------------
  deploy-aca:
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    env:
      ACA_APP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}-staging
    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy container app (staging)
        id: deploy
        run: |
          az extension add --name containerapp --upgrade --only-show-errors
          IMAGE="${ACR_NAME}.azurecr.io/${IMAGE_REPO}:${{ github.sha }}"
          UAMI_ID=$(az identity show -g "$RESOURCE_GROUP" -n "$ACR_PULL_IDENTITY_NAME" --query id -o tsv)

          if az containerapp show -n "$ACA_APP_NAME" -g "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Updating existing container app: $ACA_APP_NAME"
            az containerapp update \
              --name "$ACA_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --image "$IMAGE" \
              --output none
          else
            echo "Creating container app: $ACA_APP_NAME"
            az containerapp create \
              --name "$ACA_APP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --environment "$ACA_ENVIRONMENT" \
              --image "$IMAGE" \
              --target-port 8080 \
              --ingress external \
              --registry-server "${ACR_NAME}.azurecr.io" \
              --registry-identity "$UAMI_ID" \
              --user-assigned "$UAMI_ID" \
              --min-replicas 1 \
              --max-replicas 2 \
              --cpu 0.5 --memory 1.0Gi \
              --tags Project=quiz-app Environment=staging \
              --output none
          fi

          FQDN=$(az containerapp show -n "$ACA_APP_NAME" -g "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn -o tsv)
          echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"

      - name: Wait for staging to be ready
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Waiting for $URL to return HTTP 200..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "Staging (ACA) is ready (HTTP $CODE)."
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE, retrying in 10s..."
            sleep 10
          done
          echo "Staging (ACA) did not become ready in time."
          exit 1

      - name: Show deployed URL
        run: |
          {
            echo "## Staging Deploy (Azure Container Apps)"
            echo ""
            echo "**URL:** ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # deploy-appservice: ステージング用 Azure App Service へデプロイ
  # ---------------------------------------------------------------------------
  deploy-appservice:
    needs: build-and-publish
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deploy.outputs.url }}
    env:
      WEBAPP_NAME: ${{ vars.APP_SERVICE_WEBAPP_PREFIX }}-staging
    steps:
      - name: Download bootJar artifact
        uses: actions/download-artifact@v4
        with:
          name: app-bootjar
          path: app/build/libs

      - name: Resolve jar path
        run: |
          JAR=$(ls app/build/libs/*.jar | grep -v 'plain')
          echo "JAR_PATH=$JAR" >> "$GITHUB_ENV"
          echo "Jar to deploy: $JAR"

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Ensure App Service plan exists
        run: |
          # 空になった F1（Free）プランは Azure により自動削除されることがあるため
          # （例: PR クローズ時にプレビュー Web App が削除されプランが空になる）、
          # デプロイのたびにプランの存在を確認し、無ければ冪等に作成する。
          if az appservice plan show -n "$APP_SERVICE_PLAN" -g "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Reusing existing App Service plan: $APP_SERVICE_PLAN"
          else
            echo "Creating App Service plan: $APP_SERVICE_PLAN ($APP_SERVICE_PLAN_SKU / $APP_SERVICE_LOCATION)"
            az appservice plan create \
              --name "$APP_SERVICE_PLAN" \
              --resource-group "$RESOURCE_GROUP" \
              --is-linux \
              --sku "$APP_SERVICE_PLAN_SKU" \
              --location "$APP_SERVICE_LOCATION" \
              --output none
          fi

      - name: Create or reuse staging web app and deploy jar
        id: deploy
        run: |
          if az webapp show -n "$WEBAPP_NAME" -g "$RESOURCE_GROUP" >/dev/null 2>&1; then
            echo "Reusing existing staging web app: $WEBAPP_NAME"
          else
            echo "Creating staging web app: $WEBAPP_NAME"
            # GitHub ホストランナーの az CLI はランタイムカタログが古く
            # （JAVA|11-java11 までしか持たない）、create 時に Java 21 を直接指定すると
            # 「not supported」で弾かれる。そこでまず Java 21 を試し、失敗した場合は
            # カタログに存在する Java 11 で作成してから linux-fx-version で Java 21 を
            # 強制する（linux-fx-version は生のパススルーでカタログ検証されず、
            # App Service プラットフォーム側は Java 21 を提供するため動作する）。
            if ! az webapp create \
                  --name "$WEBAPP_NAME" \
                  --resource-group "$RESOURCE_GROUP" \
                  --plan "$APP_SERVICE_PLAN" \
                  --runtime "JAVA:21-java21" \
                  --output none 2>/dev/null; then
              echo "Java 21 の直接指定に失敗。Java 11 で作成し linux-fx-version で上書きします。"
              az webapp create \
                --name "$WEBAPP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --plan "$APP_SERVICE_PLAN" \
                --runtime "JAVA:11-java11" \
                --output none \
              || az webapp create \
                --name "$WEBAPP_NAME" \
                --resource-group "$RESOURCE_GROUP" \
                --plan "$APP_SERVICE_PLAN" \
                --runtime "JAVA|11-java11" \
                --output none
            fi
            # 実行ランタイムを Java 21 に強制する
            az webapp config set \
              --name "$WEBAPP_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --linux-fx-version "JAVA|21-java21" \
              --output none
          fi

          # ステージング識別用タグを付与
          APP_ID=$(az webapp show -n "$WEBAPP_NAME" -g "$RESOURCE_GROUP" --query id -o tsv)
          az tag update \
            --resource-id "$APP_ID" \
            --operation Merge \
            --tags Project=quiz-app Environment=staging \
            --output none

          # bootJar をデプロイ（App Service が app.jar にリネームして実行）
          az webapp deploy \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --type jar \
            --src-path "$JAR_PATH" \
            --output none

          FQDN=$(az webapp show -n "$WEBAPP_NAME" -g "$RESOURCE_GROUP" \
            --query defaultHostName -o tsv)
          echo "url=https://${FQDN}" >> "$GITHUB_OUTPUT"

      - name: Wait for staging to be ready
        run: |
          URL="${{ steps.deploy.outputs.url }}"
          echo "Waiting for $URL to return HTTP 200..."
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            if [ "$CODE" = "200" ]; then
              echo "Staging (App Service) is ready (HTTP $CODE)."
              exit 0
            fi
            echo "Attempt $i: HTTP $CODE, retrying in 10s..."
            sleep 10
          done
          echo "Staging (App Service) did not become ready in time."
          exit 1

      - name: Show deployed URL
        run: |
          {
            echo "## Staging Deploy (Azure App Service)"
            echo ""
            echo "**URL:** ${{ steps.deploy.outputs.url }}"
          } >> "$GITHUB_STEP_SUMMARY"
