<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="'結果 Q' + ${quiz.id()} + ' - この数字、なんの数字？'">結果</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-dark navbar-gradient mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">この数字、なんの数字？</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <span th:text="'Q' + ${quiz.id()} + ' / ' + ${totalCount} + ' - 結果'">Q1 / 3 - 結果</span>
                </div>
                <div class="card-body text-center">
                    <h2 class="display-3 my-3" th:text="${quiz.number()}">3,776</h2>

                    <div th:if="${correct}" class="alert alert-success" role="alert">
                        <h3>&#x2B50; 正解！</h3>
                    </div>
                    <div th:unless="${correct}" class="alert alert-danger" role="alert">
                        <h3>&#x274C; 不正解...</h3>
                        <p>
                            あなたの回答:
                            <strong th:text="${quiz.choices().get(selectedAnswer)}">選択肢</strong>
                        </p>
                    </div>

                    <p class="mt-3">
                        正解: <strong th:text="${quiz.choices().get(quiz.answer())}">正解の選択肢</strong>
                    </p>
                    <div class="alert alert-info text-start mt-3">
                        <strong>解説:</strong>
                        <span th:text="${quiz.explanation()}">解説文</span>
                    </div>
                </div>
            </div>

            <div class="d-flex justify-content-center gap-3 mt-3">
                <a th:if="${quiz.id() < totalCount}"
                   th:href="@{/quiz/{id}(id=${quiz.id() + 1})}"
                   class="btn btn-primary">次の問題へ</a>
                <a th:href="@{/}" class="btn btn-secondary">一覧に戻る</a>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
