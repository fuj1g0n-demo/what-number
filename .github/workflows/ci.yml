name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle build

      - name: Unit Test
        run: gradle test

      - name: Integration Test
        run: gradle integrationTest

      - name: Install Playwright browsers
        run: gradle :systemTestClasses && npx playwright install --with-deps chromium

      - name: System Test
        run: |
          gradle bootRun &
          sleep 10
          gradle systemTest
          kill %1 || true
